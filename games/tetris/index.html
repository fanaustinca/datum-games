<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Tetris</title>
<style>
  :root { --bg: #06070a; --grid: #12141c; --cell: #1b1e28; --text: #eef0f7; --dim: #9aa0b4; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 0.85rem; color: var(--dim); flex-shrink: 0; gap: 10px; }
  #hud strong { color: var(--text); font-size: 1rem; }
  #main { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 0; padding: 8px; }
  #board-wrap { position: relative; height: 100%; max-height: 560px; aspect-ratio: 10 / 20; }
  canvas#board { background: var(--grid); border-radius: 10px; width: 100%; height: 100%; display: block; }
  #side { display: flex; flex-direction: column; gap: 12px; }
  #next-wrap { background: var(--grid); border-radius: 10px; padding: 10px; }
  #next-label { font-size: 0.7rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  canvas#next { display: block; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(6,7,10,0.86); text-align: center; padding: 20px; border-radius: 10px; }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.3rem; }
  #overlay p { margin: 0; color: var(--dim); font-size: 0.85rem; }
  button.primary { background: linear-gradient(135deg, #7c5cff, #39e6ff); border: none; color: #06070a; font-weight: 700; padding: 10px 22px; border-radius: 999px; cursor: pointer; font-size: 0.9rem; }
  #touch-controls { display: none; flex-shrink: 0; padding: 8px 12px 14px; justify-content: center; gap: 8px; }
  #touch-controls button { background: var(--cell); color: var(--text); border: 1px solid #262a37; border-radius: 10px; font-size: 1.2rem; padding: 12px 18px; }
  @media (pointer: coarse) { #touch-controls { display: flex; } #side { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>Score: <strong id="score">0</strong></span>
    <span>Lines: <strong id="lines">0</strong></span>
    <span>Best: <strong id="best">0</strong></span>
  </div>
  <div id="main">
    <div id="board-wrap">
      <canvas id="board"></canvas>
      <div id="overlay">
        <h2 id="overlay-title">Tetris</h2>
        <p id="overlay-msg">Arrow keys or WASD to move, Up/W to rotate, Space to hard drop.</p>
        <button class="primary" id="start-btn">Start</button>
      </div>
    </div>
    <div id="side">
      <div id="next-wrap">
        <div id="next-label">Next</div>
        <canvas id="next" width="88" height="88"></canvas>
      </div>
    </div>
  </div>
  <div id="touch-controls">
    <button data-act="left">◀</button>
    <button data-act="rotate">⟳</button>
    <button data-act="right">▶</button>
    <button data-act="down">▼</button>
    <button data-act="drop">⤓</button>
  </div>
</div>

<script>
(function () {
  const COLS = 10, ROWS = 20;
  const boardCanvas = document.getElementById("board");
  const bctx = boardCanvas.getContext("2d");
  const nextCanvas = document.getElementById("next");
  const nctx = nextCanvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const linesEl = document.getElementById("lines");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayMsg = document.getElementById("overlay-msg");
  const startBtn = document.getElementById("start-btn");

  const BEST_KEY = "datum-tetris-best";
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  const COLORS = { I: "#39e6ff", O: "#ffd23f", T: "#7c5cff", S: "#39ff88", Z: "#ff5c7c", J: "#4b7bff", L: "#ff9f43" };
  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
  };
  const KEYS = Object.keys(SHAPES);

  let grid, cell, current, next, score, lines, level, over, running, dropTimer, dropInterval;

  function resizeCanvas() {
    const rect = boardCanvas.getBoundingClientRect();
    boardCanvas.width = rect.width * devicePixelRatio;
    boardCanvas.height = rect.height * devicePixelRatio;
    cell = boardCanvas.width / COLS;
  }
  window.addEventListener("resize", () => { resizeCanvas(); draw(); });

  function emptyGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function randomPiece() {
    const type = KEYS[Math.floor(Math.random() * KEYS.length)];
    return { type, cells: SHAPES[type].map(([x, y]) => [x, y]), x: 3, y: -1, rotation: 0 };
  }

  function rotateCells(cells) {
    const cx = 1.5, cy = 1.5;
    return cells.map(([x, y]) => {
      const rx = cx - (y - cy);
      const ry = cy + (x - cx);
      return [Math.round(rx), Math.round(ry)];
    });
  }

  function collides(cells, ox, oy) {
    return cells.some(([x, y]) => {
      const gx = x + ox, gy = y + oy;
      if (gx < 0 || gx >= COLS || gy >= ROWS) return true;
      if (gy < 0) return false;
      return grid[gy][gx];
    });
  }

  function place() {
    current.cells.forEach(([x, y]) => {
      const gx = current.x + x, gy = current.y + y;
      if (gy >= 0) grid[gy][gx] = current.type;
    });
    clearLines();
    current = next;
    next = randomPiece();
    drawNext();
    if (collides(current.cells, current.x, current.y)) return gameOver();
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every((c) => c)) {
        grid.splice(r, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared) {
      const points = [0, 100, 300, 500, 800][cleared] * (level + 1);
      score += points;
      lines += cleared;
      level = Math.floor(lines / 10);
      dropInterval = Math.max(120, 700 - level * 55);
      scoreEl.textContent = score;
      linesEl.textContent = lines;
      if (score > best) { best = score; localStorage.setItem(BEST_KEY, best); bestEl.textContent = best; }
    }
  }

  function tryMove(dx, dy) {
    if (!collides(current.cells, current.x + dx, current.y + dy)) {
      current.x += dx;
      current.y += dy;
      return true;
    }
    return false;
  }

  function tryRotate() {
    const rotated = rotateCells(current.cells);
    for (const kick of [0, -1, 1, -2, 2]) {
      if (!collides(rotated, current.x + kick, current.y)) {
        current.cells = rotated;
        current.x += kick;
        return;
      }
    }
  }

  function hardDrop() {
    while (tryMove(0, 1)) {}
    place();
    draw();
  }

  function softDrop() {
    if (!tryMove(0, 1)) place();
    draw();
  }

  function draw() {
    bctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c]) drawCell(bctx, c, r, COLORS[grid[r][c]]);
        else { bctx.fillStyle = "rgba(255,255,255,0.03)"; bctx.fillRect(c * cell + 1, r * cell + 1, cell - 2, cell - 2); }
      }
    }
    if (current) {
      current.cells.forEach(([x, y]) => {
        const gy = current.y + y;
        if (gy >= 0) drawCell(bctx, current.x + x, gy, COLORS[current.type]);
      });
    }
  }

  function drawCell(ctx, x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * cell + 1, y * cell + 1, cell - 2, cell - 2);
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const size = 18;
    const xs = next.cells.map((c) => c[0]), ys = next.cells.map((c) => c[1]);
    const minX = Math.min(...xs), minY = Math.min(...ys);
    next.cells.forEach(([x, y]) => {
      nctx.fillStyle = COLORS[next.type];
      nctx.fillRect(10 + (x - minX) * size, 10 + (y - minY) * size, size - 2, size - 2);
    });
  }

  function loop(ts) {
    if (!running) return;
    if (!dropTimer) dropTimer = ts;
    if (ts - dropTimer > dropInterval) {
      dropTimer = ts;
      softDrop();
    }
    requestAnimationFrame(loop);
  }

  function start() {
    grid = emptyGrid();
    score = 0; lines = 0; level = 0; over = false; dropInterval = 700; dropTimer = 0;
    scoreEl.textContent = 0; linesEl.textContent = 0;
    current = randomPiece();
    next = randomPiece();
    drawNext();
    resizeCanvas();
    draw();
    running = true;
    overlay.classList.add("hidden");
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    over = true;
    overlayTitle.textContent = "Game over";
    overlayMsg.textContent = `Score: ${score} · Lines: ${lines}`;
    startBtn.textContent = "Try again";
    overlay.classList.remove("hidden");
  }

  window.addEventListener("keydown", (e) => {
    if (!running) return;
    if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","a","A","d","D","w","W","s","S"," "].includes(e.key)) e.preventDefault();
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { tryMove(-1, 0); draw(); }
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { tryMove(1, 0); draw(); }
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") { softDrop(); }
    else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") { tryRotate(); draw(); }
    else if (e.key === " ") { hardDrop(); }
  });

  document.querySelectorAll("#touch-controls button").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (!running) return;
      const act = btn.dataset.act;
      if (act === "left") tryMove(-1, 0);
      else if (act === "right") tryMove(1, 0);
      else if (act === "down") { softDrop(); return draw(); }
      else if (act === "rotate") tryRotate();
      else if (act === "drop") return hardDrop();
      draw();
    });
  });

  startBtn.addEventListener("click", start);
  grid = emptyGrid();
  resizeCanvas();
  draw();
})();
</script>
</body>
</html>
