<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Connect Four</title>
<style>
  :root { --bg: #06070a; --grid: #12141c; --cell: #1b1e28; --text: #eef0f7; --dim: #9aa0b4; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #hud { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; font-size: 0.85rem; color: var(--dim); flex-shrink: 0; gap: 10px; }
  #hud strong { color: var(--text); font-size: 1rem; }
  #hud button { background: var(--cell); border: 1px solid #262a37; color: var(--text); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 0.8rem; }
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; gap: 14px; padding: 10px; }
  #status { color: var(--dim); font-size: 0.95rem; min-height: 1.4em; }
  #board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    background: var(--grid);
    padding: 8px;
    border-radius: 12px;
    width: min(94vw, 480px);
    aspect-ratio: 7 / 6;
  }
  .cell {
    background: var(--cell);
    border-radius: 50%;
    position: relative;
    cursor: pointer;
  }
  .cell.col-hover { background: #262a37; }
  .disc {
    position: absolute; inset: 8%;
    border-radius: 50%;
  }
  .disc.p1 { background: radial-gradient(circle at 35% 30%, #6bf5ff, #39e6ff); }
  .disc.p2 { background: radial-gradient(circle at 35% 30%, #ffdd7a, #ffd23f); }
  .cell.win .disc { box-shadow: 0 0 0 3px #39ff88; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>You: <strong style="color:#39e6ff">●</strong> &nbsp; CPU: <strong style="color:#ffd23f">●</strong></span>
    <button id="restart-btn">Restart</button>
  </div>
  <div id="stage">
    <div id="status">Your move</div>
    <div id="board"></div>
  </div>
</div>

<script>
(function () {
  const COLS = 7, ROWS = 6;
  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");

  let grid, over, cellEls;

  function emptyGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  }

  function lowestEmptyRow(g, c) {
    for (let r = ROWS - 1; r >= 0; r--) if (g[r][c] === 0) return r;
    return -1;
  }

  function checkWin(g, player) {
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (g[r][c] !== player) continue;
        for (const [dr, dc] of dirs) {
          const cellsWon = [[r,c]];
          for (let i = 1; i < 4; i++) {
            const nr = r + dr * i, nc = c + dc * i;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || g[nr][nc] !== player) break;
            cellsWon.push([nr, nc]);
          }
          if (cellsWon.length === 4) return cellsWon;
        }
      }
    }
    return null;
  }

  function isFull(g) {
    return g[0].every((v) => v !== 0);
  }

  function scorePosition(g, player) {
    let score = 0;
    const opp = player === 1 ? 2 : 1;
    const centerCol = Math.floor(COLS / 2);
    for (let r = 0; r < ROWS; r++) score += (g[r][centerCol] === player ? 1 : 0) * 3;

    function windowScore(cells) {
      const pc = cells.filter((v) => v === player).length;
      const oc = cells.filter((v) => v === opp).length;
      const ec = cells.filter((v) => v === 0).length;
      if (pc === 4) return 100000;
      if (pc === 3 && ec === 1) return 50;
      if (pc === 2 && ec === 2) return 10;
      if (oc === 3 && ec === 1) return -80;
      return 0;
    }

    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        for (const [dr, dc] of dirs) {
          const cells = [];
          for (let i = 0; i < 4; i++) {
            const nr = r + dr * i, nc = c + dc * i;
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) { cells.length = 0; break; }
            cells.push(g[nr][nc]);
          }
          if (cells.length === 4) score += windowScore(cells);
        }
      }
    }
    return score;
  }

  function validCols(g) {
    const out = [];
    for (let c = 0; c < COLS; c++) if (g[0][c] === 0) out.push(c);
    return out;
  }

  function minimax(g, depth, alpha, beta, maximizing) {
    const cols = validCols(g);
    const winCPU = checkWin(g, 2);
    const winPlayer = checkWin(g, 1);
    if (winCPU) return { score: 10000000 + depth };
    if (winPlayer) return { score: -10000000 - depth };
    if (!cols.length || depth === 0) return { score: scorePosition(g, 2) };

    if (maximizing) {
      let best = { score: -Infinity, col: cols[0] };
      for (const c of cols) {
        const r = lowestEmptyRow(g, c);
        g[r][c] = 2;
        const { score } = minimax(g, depth - 1, alpha, beta, false);
        g[r][c] = 0;
        if (score > best.score) best = { score, col: c };
        alpha = Math.max(alpha, score);
        if (alpha >= beta) break;
      }
      return best;
    } else {
      let best = { score: Infinity, col: cols[0] };
      for (const c of cols) {
        const r = lowestEmptyRow(g, c);
        g[r][c] = 1;
        const { score } = minimax(g, depth - 1, alpha, beta, true);
        g[r][c] = 0;
        if (score < best.score) best = { score, col: c };
        beta = Math.min(beta, score);
        if (alpha >= beta) break;
      }
      return best;
    }
  }

  function render(winCells) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const el = cellEls[r][c];
        el.innerHTML = "";
        el.classList.remove("win");
        if (grid[r][c]) {
          const disc = document.createElement("div");
          disc.className = "disc " + (grid[r][c] === 1 ? "p1" : "p2");
          el.appendChild(disc);
        }
      }
    }
    if (winCells) winCells.forEach(([r, c]) => cellEls[r][c].classList.add("win"));
  }

  function dropDisc(c, player) {
    const r = lowestEmptyRow(grid, c);
    if (r === -1) return false;
    grid[r][c] = player;
    return true;
  }

  function playerMove(c) {
    if (over) return;
    if (!dropDisc(c, 1)) return;
    render();
    const win = checkWin(grid, 1);
    if (win) return endGame(win, "You win! 🎉");
    if (isFull(grid)) return endGame(null, "It's a draw.");
    statusEl.textContent = "CPU is thinking…";
    setTimeout(cpuMove, 260);
  }

  function cpuMove() {
    if (over) return;
    const { col } = minimax(grid, 5, -Infinity, Infinity, true);
    dropDisc(col, 2);
    render();
    const win = checkWin(grid, 2);
    if (win) return endGame(win, "CPU wins.");
    if (isFull(grid)) return endGame(null, "It's a draw.");
    statusEl.textContent = "Your move";
  }

  function endGame(win, msg) {
    over = true;
    render(win);
    statusEl.textContent = msg;
  }

  function start() {
    grid = emptyGrid();
    over = false;
    statusEl.textContent = "Your move";
    render();
  }

  boardEl.innerHTML = "";
  cellEls = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      const el = document.createElement("div");
      el.className = "cell";
      el.addEventListener("click", () => playerMove(c));
      el.addEventListener("mouseenter", () => highlightCol(c, true));
      el.addEventListener("mouseleave", () => highlightCol(c, false));
      boardEl.appendChild(el);
      row.push(el);
    }
    cellEls.push(row);
  }

  function highlightCol(c, on) {
    for (let r = 0; r < ROWS; r++) cellEls[r][c].classList.toggle("col-hover", on && !grid[r][c] && !over);
  }

  document.getElementById("restart-btn").addEventListener("click", start);
  start();
})();
</script>
</body>
</html>
